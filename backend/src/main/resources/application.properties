spring.application.name=backend

# Spring no lee .env por sí solo: lo importamos (ruta relativa a backend/).
# "optional" evita fallar si no existe (p. ej. dentro de Docker, donde las
# variables llegan como variables de entorno reales).
spring.config.import=optional:file:../.env[.properties]

# Base de datos. Los valores salen de .env; DB_PASSWORD no tiene valor por
# defecto a propósito, para no dejar contraseñas en el repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reviews}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo gestiona Flyway (src/main/resources/db/migration);
# Hibernate solo comprueba que las entidades encajen con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ai-service (docs/api.md). El análisis en CPU puede tardar unos segundos.
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
ai-service.connect-timeout=2s
ai-service.read-timeout=30s
