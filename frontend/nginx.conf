server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # La API. Hace lo mismo que proxy.conf.json en desarrollo: el navegador solo habla con
    # este servidor y el backend no necesita CORS. "backend" es el nombre del servicio en
    # docker-compose.yml. El tiempo de espera cubre el del backend con el ai-service (30 s).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Los archivos con hash en el nombre (main-XXXX.js) no cambian nunca: se pueden guardar un año.
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header en un location sustituye al del server: se repiten las cabeceras de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Angular es una SPA: cualquier ruta que no sea un archivo (/historial, /estadisticas) devuelve
    # index.html y el enrutador de Angular decide qué pantalla mostrar. index.html no se cachea,
    # para que una versión nueva se vea enseguida.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
