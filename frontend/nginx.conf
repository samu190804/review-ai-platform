server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # La API. Hace lo mismo que proxy.conf.json en desarrollo: el navegador solo habla con
    # este servidor y el backend no necesita CORS. "backend" es el nombre del servicio en
    # docker-compose.yml. El tiempo de espera cubre el del backend con el ai-service (30 s).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Los archivos con hash en el nombre (main-XXXX.js) no cambian nunca: se pueden guardar un año.
    # Se usa "expires" y no "add_header Cache-Control": un add_header dentro de un location anula
    # todos los del server (incluidas las cabeceras de seguridad de arriba), y "expires" no.
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Angular es una SPA: cualquier ruta que no sea un archivo (/historial, /estadisticas) devuelve
    # index.html y el enrutador de Angular decide qué pantalla mostrar. index.html no se cachea
    # ("expires -1" envía no-cache), para que una versión nueva se vea enseguida.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
