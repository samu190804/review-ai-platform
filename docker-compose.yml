services:
  ai-service:
    build: ./ai-service
    image: review-ai-service
    container_name: review-ai-service
    ports:
      - "8000:8000"
    environment:
      MODELNAME: ${MODELNAME:-nlptown-bert-v1}
      TOXIC_THRESHOLD: ${TOXIC_THRESHOLD:-0.90}
      MIN_LENGTH: ${MIN_LENGTH:-10}
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: review-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: review-backend
    container_name: review-backend
    ports:
      # Solo en 127.0.0.1: la API todavía no tiene autenticación (Spring Security llegará al final).
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      # Dentro de Docker los servicios se llaman por su nombre, no por localhost: por eso estas
      # dos variables se fijan aquí y no se leen del DB_URL / AI_SERVICE_URL de .env, que son
      # para cuando el backend se ejecuta fuera de Docker (mvnw spring-boot:run).
      DB_URL: jdbc:postgresql://postgres:5432/reviews
      AI_SERVICE_URL: http://ai-service:8000
      DB_USER: ${DB_USER:?Define DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: review-frontend
    container_name: review-frontend
    ports:
      # La aplicación: http://localhost:4200. nginx reenvía /api al backend.
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Interfaz web para ver y gestionar la base de datos. Solo para desarrollo:
  # no arranca con un "up" normal, hay que pedirlo con --profile tools.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: review-pgadmin
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      # Obligatorios para que la imagen arranque; en modo escritorio no se piden al entrar.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      # Modo escritorio: sin pantalla de login. Seguro porque solo escucha en 127.0.0.1.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
